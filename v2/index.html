<script src="./demo-kols.js?v=1"></script>
<script>
(function () {
  var back = document.getElementById("login");
  if (window.DonutDemo) DonutDemo.renderPicker(document.getElementById("login-demo"), "./claim.html");
  var cta = document.getElementById("claim-cta");
  cta.addEventListener("click", function (e) { e.preventDefault(); back.hidden = false; });
  back.addEventListener("click", function (e) { if (e.target === back) back.hidden = true; });
  back.querySelector(".login-close").addEventListener("click", function () { back.hidden = true; });
  addEventListener("keydown", function (e) { if (e.key === "Escape" && !back.hidden) back.hidden = true; });
  if (location.hash === "#login") back.hidden = false;

  /* fan carousel: swipe moves the whole fan one slot; the 12 archetypes cycle through.
     Each card is the live flashcard ticket (amethyst): archetype name as the big title,
     the archetype art as the pfp, the duplicate subtitle hidden via same-origin injection. */
  var DECK = [
    ["01-diamond-hands", "Diamond Hands"], ["08-momentum-rider", "Momentum Rider"],
    ["10-narrative-trader", "Narrative Trader"], ["09-arb-researcher", "Arb Researcher"],
    ["02-dca-believer", "DCA Believer"], ["03-risk-explorer", "Risk Explorer"],
    ["04-day-trader", "Day Trader"], ["05-sniper", "Sniper"],
    ["06-grid-executor", "Grid Executor"], ["07-swing-hunter", "Swing Hunter"],
    ["11-risk-first", "Risk-First"], ["12-contrarian", "Contrarian"]
  ];
  /* the character rides its own layer (v2/art cutouts) over the card's black photo window */
  function cutUrl(slug) { return "./art/" + slug + ".webp"; }
  DECK.forEach(function (t) { new Image().src = cutUrl(t[0]); });
  function cardUrl(t) {
    /* kol-v0.html = the build served at :8477 (square photo, plain big title), snapshotted into the repo */
    return "../flashcard/kol-v0.html?code=DONUT2026" +
      "&user=" + encodeURIComponent(t[1].toUpperCase()) +
      "&type=" + encodeURIComponent(t[1]);
  }
  /* 6 slots: 0 and 5 sit offscreen, 1-4 are the visible fan */
  var POS_D = [
    { l: "-23%", b: -280, r: -28 },
    { l: "3%",   b: -150, r: -18 },
    { l: "28%",  b: -115, r: -7 },
    { l: "52%",  b: -120, r: 7 },
    { l: "77%",  b: -155, r: 18 },
    { l: "101%", b: -280, r: 28 }
  ];
  var POS_M = [
    { l: "-75%", b: -240, r: -28 },
    { l: "-9%",  b: -105, r: -18 },
    { l: "26%",  b: -85,  r: -5 },
    { l: "61%",  b: -95,  r: 14 },
    { l: "101%", b: -240, r: 28 },
    { l: "140%", b: -300, r: 34 }
  ];
  function POS() { return matchMedia("(max-width: 700px)").matches ? POS_M : POS_D; }
  var fan = document.querySelector(".cardfan");
  var cards = [].slice.call(document.querySelectorAll(".fan-card"));
  while (cards.length < 6) { var cl = cards[0].cloneNode(true); fan.appendChild(cl); cards.push(cl); }
  var head = 11;        /* DECK index shown in slot 0 */
  var slotOf = [1, 2, 3, 4, 0, 5]; /* the four markup cards start in the visible slots */
  var shifting = false;
  var popTimers = new WeakMap();
  cards.forEach(function (card) {
    var f = card.querySelector("iframe");
    f.addEventListener("load", function () {
      try {
        /* embed styling lives in kol-v0.html itself; here only force purple (v0 picks a skin per type) */
        var dlg = f.contentDocument && f.contentDocument.getElementById("flashcard");
        if (dlg) dlg.dataset.skin = "amethyst";
      } catch (e) {}
      /* the ticket's stage unhides 750ms after load; start the character with it so they rise together */
      clearTimeout(popTimers.get(card));
      popTimers.set(card, setTimeout(function () { card.classList.add("pop-ready"); }, 750));
    });
  });
  function setArt(j) {
    var t = DECK[(head + slotOf[j]) % 12];
    cards[j].classList.remove("pop-ready");
    cards[j].querySelector("iframe").src = cardUrl(t);
    cards[j].querySelector(".fan-pop").src = cutUrl(t[0]);
  }
  function place(j, instant) {
    var p = POS()[slotOf[j]], el = cards[j];
    if (instant) el.classList.add("no-trans");
    el.style.left = p.l; el.style.right = "auto";
    el.style.bottom = p.b + "px";
    el.style.transform = "rotate(" + p.r + "deg)";
    el.style.zIndex = (slotOf[j] === 0 || slotOf[j] === 5) ? 1 : 2;
    if (instant) { void el.offsetWidth; el.classList.remove("no-trans"); }
  }
  cards.forEach(function (_, j) { place(j, true); setArt(j); });
  addEventListener("resize", function () { cards.forEach(function (_, j) { place(j, true); }); });
  function shift(dir) { /* dir 1 = swipe left, deck advances */
    if (shifting) return; shifting = true;
    head = (head + dir + 12) % 12;
    cards.forEach(function (_, j) {
      var ns = slotOf[j] - dir;
      if (ns < 0 || ns > 5) {
        slotOf[j] = ns < 0 ? 5 : 0;
        setArt(j); place(j, true);
      } else {
        slotOf[j] = ns; place(j, false);
      }
    });
    setTimeout(function () { shifting = false; }, 540);
  }
  /* swipe turns the fan.
     Trackpad: a two-finger horizontal swipe over a card (wheel deltaX).
     Touch / mouse: the fan follows the finger 1:1 and turns as soon as the gesture passes 45px —
     no long drag-and-release, and chained swipes keep turning. */
  var wheelAcc = 0, wheelCool = false, wheelTO = null;
  function wheelTurn(e) {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (wheelCool) return;
    wheelAcc += e.deltaX;
    fan.style.transform = "translateX(" + Math.max(-60, Math.min(60, -wheelAcc * 0.4)) + "px)";
    clearTimeout(wheelTO);
    wheelTO = setTimeout(function () { wheelAcc = 0; fan.style.transform = ""; }, 150);
    if (Math.abs(wheelAcc) > 50) {
      shift(wheelAcc > 0 ? 1 : -1);
      wheelAcc = 0; wheelCool = true; fan.style.transform = "";
      setTimeout(function () { wheelCool = false; }, 450);
    }
  }
  var swipeX = null;
  function swipeMove(e) {
    if (swipeX === null) return;
    var dx = e.clientX - swipeX;
    fan.style.transform = "translateX(" + Math.max(-90, Math.min(90, dx * 0.5)) + "px)";
    if (Math.abs(dx) > 45 && !shifting) {
      shift(dx < 0 ? 1 : -1);
      swipeX = e.clientX;
      fan.style.transform = "";
    }
  }
  function swipeEnd() {
    if (swipeX === null) return;
    swipeX = null;
    fan.classList.remove("dragging");
    fan.style.transform = "";
  }
  var zone = document.querySelector(".fan-zone");
  cards.concat([zone]).forEach(function (surface) {
    surface.addEventListener("wheel", wheelTurn, { passive: false });
    surface.addEventListener("pointerdown", function (e) {
      swipeX = e.clientX;
      fan.classList.add("dragging");
      surface.setPointerCapture(e.pointerId);
    });
  });
  addEventListener("pointermove", swipeMove);
  addEventListener("pointerup", swipeEnd);
  addEventListener("pointercancel", swipeEnd);

  /* hover tilt: the card follows the mouse; the character layer sits deeper, so it parallaxes */
  cards.forEach(function (card) {
    var tilt = card.querySelector(".fan-tilt");
    card.addEventListener("pointermove", function (e) {
      if (e.pointerType === "touch") return;
      var r = card.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      tilt.style.transform = "perspective(800px) rotateY(" + (px * 14).toFixed(2) + "deg) rotateX(" + (-py * 12).toFixed(2) + "deg)";
    });
    card.addEventListener("pointerleave", function () { tilt.style.transform = ""; });
  });

  /* opening: 3/4 of the deck (9 turns), back-to-back; any interaction cancels it */
  var autoTimers = [];
  for (var s = 0; s < 9; s++) {
    autoTimers.push(setTimeout(function () { shift(1); }, 1400 + s * 545));
  }
  function stopAuto() { autoTimers.forEach(clearTimeout); }
  addEventListener("pointerdown", stopAuto, { once: true });
  addEventListener("wheel", stopAuto, { once: true });

  var d0 = document.getElementById("try-d0");
  d0.addEventListener("click", function (e) {
    if (d0.getAttribute("href") === "#") e.preventDefault();
    d0.classList.remove("launch");
    void d0.offsetWidth; /* restart the animation */
    d0.classList.add("launch");
  });
})();
</script>

</body>
</html>
