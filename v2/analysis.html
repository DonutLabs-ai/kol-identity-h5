<style>
@font-face { font-family: "Timeless Serif"; font-weight: 350; font-style: italic; font-display: swap; src: url(./fonts/TimelessSerif-BookItalic.woff2) format("woff2"); }
.reveal-main {
  position: relative; z-index: 5;
  display: grid; grid-template-columns: 480px 1fr; gap: 72px;
  max-width: 1200px; margin: 0 auto; padding: 118px 40px 40px;
  align-items: center; min-height: calc(100dvh - 16px); box-sizing: border-box;
}

/* other trader types — based on the original flow (identity/theme.css .donut-locked) */
.others { position: relative; z-index: 5; padding: 0 0 90px; color: #fff; }
.others-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  max-width: 1200px; margin: 0 auto 20px; padding: 0 50px; box-sizing: border-box;
}
.others-head h2 { margin: 0; font: 465 24px/1.1 var(--serif); color: #fff; }
.others-head p { margin: 0; font: 400 13px/1.4 var(--mono); color: rgb(255 255 255 / .55); }
/* full-bleed row: first card inset to the heading, cards bleed off BOTH edges when scrolled */
.others-row {
  --inset: max(50px, calc((100vw - 1200px) / 2 + 50px));
  display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity;
  padding: 4px 50px 12px var(--inset); scroll-padding-left: var(--inset);
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.others-row::-webkit-scrollbar { display: none; }
.other-card {
  position: relative; flex: 0 0 150px; scroll-snap-align: start;
  border-radius: 16px; overflow: hidden; background: #0e0c17; aspect-ratio: 723 / 965;
}
.other-card img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(.45); transition: filter .3s ease, transform .3s ease; }
.other-card:hover img { filter: grayscale(.6) brightness(.6); }
.other-card.unlocked img { filter: none; }
.other-card.unlocked:hover img { filter: none; transform: scale(1.04); }
.other-card .oc-badge {
  position: absolute; left: 10px; top: 10px;
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px;
  font: 500 11px/14px var(--mono); letter-spacing: .04em; color: #fff;
  background: rgb(10 6 28 / .7); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35);
}
.other-card.unlocked .oc-badge { color: #0c0b12; background: var(--accent-light); box-shadow: none; }
.other-card .oc-badge svg { width: 11px; height: 11px; }
.other-card .oc-name {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 10px 10px;
  font: 465 15px/1.15 var(--serif); color: #fff;
  background: linear-gradient(180deg, transparent, rgb(5 5 7 / .85));
}
.other-card.unlocked { box-shadow: 0 12px 32px rgb(115 97 255 / .3); }
@media (max-width: 760px) {
  .others-head { flex-direction: column; align-items: flex-start; gap: 4px; padding: 0 20px; }
  .others-row { padding: 4px 20px 12px; }
  .other-card { flex-basis: 132px; }
}

/* left: the card arrives slowly (rise, unblur, bloom), character pops on its own layer */
.reveal-stage { position: relative; width: 414px; height: 575px; justify-self: center; }
.reveal-bloom {
  position: absolute; inset: -120px; pointer-events: none;
  background: radial-gradient(50% 42% at 50% 50%, rgb(115 97 255 / .35), transparent 70%);
  opacity: 0; animation: bloom-in 2.4s ease .5s forwards;
}
.reveal-tilt {
  position: relative; width: 414px; height: 575px;
  transform-style: preserve-3d; transition: transform .18s ease-out;
}
.reveal-tilt iframe { position: absolute; left: -63px; top: -88px; width: 540px; height: 750px; border: 0; background: transparent; pointer-events: none; }
/* 2.5D portrait, three planes: the card's own photo is the blurred ground (L0),
   a clipped sharp plane carries the crowd (L1), and the cut-out girl rides on top (L2) */
.reveal-win {
  position: absolute; left: 51px; top: 47px; width: 312px; height: 312px;
  border-radius: 14px; overflow: hidden; clip-path: inset(0 round 14px); pointer-events: none; z-index: 2;
  transform: translateZ(16px);
  /* appearing waits for the card's front face (visibility swaps at ~.42s into the flip) */
  transition: opacity .3s ease .45s;
}
.reveal-mid {
  position: absolute; left: -14px; top: -14px; width: 340px; height: 340px;
  object-fit: cover; object-position: 50% 0%;
  transform: translate(var(--mx, 0px), var(--my, 0px));
}
.reveal-stage.flipped .reveal-win { opacity: 0; transition: opacity .18s ease 0s; }
/* parent-side click catcher: a flat stage child, outside every 3D subtree */
.reveal-hit { position: absolute; left: 0; top: 0; width: 414px; height: 575px; z-index: 6; cursor: pointer; }

.reveal-pop {
  position: absolute; left: 51px; top: 39px; width: 312px; height: 312px;
  object-fit: cover; object-position: 50% 0%;
  z-index: 3; pointer-events: none;
  clip-path: inset(14px 0 0 0); /* clipped to the window top: pops forward, never over the notch */
  /* scale compensates the perspective magnification of translateZ, so she stays true-size */
  transform: translate(var(--px, 0px), var(--py, 0px)) translateZ(24px) scale(1.04); transform-origin: 50% 30%;
  filter: drop-shadow(0 10px 22px rgb(0 0 0 / .5));
  transition: opacity .3s ease .45s;
}
.reveal-stage.flipped .reveal-pop { opacity: 0; transition: opacity .18s ease 0s; }
.reveal-card-wrap { width: 414px; height: 575px; transform-style: preserve-3d; }
@media (prefers-reduced-motion: no-preference) {
  body:not(.revealed) .reveal-card-wrap, body:not(.revealed) .reveal-info,
  body:not(.revealed) .reveal-hint, body:not(.revealed) .reveal-bloom { opacity: 0; animation: none; }
  .revealed .reveal-card-wrap {
    opacity: 0; filter: blur(16px); transform: translateY(46px) scale(.84);
    animation: card-reveal 2s cubic-bezier(.22,.9,.24,1) .1s forwards;
  }
  @keyframes card-reveal {
    60% { opacity: 1; }
    100% { opacity: 1; filter: blur(0); transform: none; }
  }
  .revealed .reveal-info { opacity: 0; translate: 0 18px; animation: rise .9s cubic-bezier(.2,.7,.2,1) 1.6s forwards; }
  .revealed .reveal-hint { animation: rise .8s ease 2.2s forwards; }
  .revealed .reveal-bloom { animation: bloom-in 2.4s ease .1s forwards; }
}
@keyframes bloom-in { to { opacity: 1; } }
.reveal-hint {
  margin-top: 18px; text-align: center;
  font: 500 13px/1 var(--mono); color: rgb(255 255 255 / .45);
  opacity: 0;
}

/* analyzing: D0 reads the answers before the card shows itself */
.analyze {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-content: center; justify-items: center; gap: 20px;
  background: rgb(5 5 9 / .55);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: opacity .45s ease;
}
.analyze.done { opacity: 0; pointer-events: none; }
.az-mark { position: relative; width: 74px; height: 74px; display: grid; place-items: center; }
.az-mark img { width: 44px; height: 44px; }
.az-mark::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid rgb(172 170 255 / .4); border-top-color: rgb(172 170 255 / .95);
}
.az-status { font: 500 14px/1.4 var(--mono); color: rgb(255 255 255 / .75); min-height: 20px; }
/* the loading bar is a run of parallelograms lighting up pink to gold */
.az-bar { display: flex; gap: 5px; }
.az-bar i {
  width: 13px; height: 11px; transform: skewX(-22deg);
  background: rgb(255 255 255 / .12); border-radius: 2px;
}
@media (prefers-reduced-motion: no-preference) {
  .az-mark img { animation: az-breathe 2.2s ease-in-out infinite; }
  .az-mark::before { animation: az-spin 1.1s linear infinite; }
  .az-bar i { animation: az-cell .12s ease var(--dl, 0s) forwards; }
  @keyframes az-spin { to { rotate: 360deg; } }
  @keyframes az-breathe { 0%, 100% { scale: 1; } 50% { scale: 1.12; } }
  @keyframes az-cell { to { background: var(--c); box-shadow: 0 0 12px var(--c); } }
}

/* right: the conclusion */
.reveal-info { display: grid; gap: 22px; align-content: center; }
.reveal-eyebrow {
  font: 600 12px/1 var(--mono); letter-spacing: 3px; text-transform: uppercase;
  width: fit-content;
  background: linear-gradient(90deg, #ff7ac2, #ffd176);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.reveal-info h1 {
  margin: -6px 0 0;
  font: 465 clamp(34px, 3.4vw, 52px)/1.05 var(--serif); letter-spacing: .01em; color: #fff;
}
.reveal-quote {
  font: italic 350 24px/1.45 "Timeless Serif", Georgia, serif;
  color: rgb(255 255 255 / .94);
  width: 42ch; max-width: 100%;
}
.reveal-quote span:last-child { display: block; margin-top: 6px; font: 400 13px/1.4 var(--mono); font-style: normal; color: rgb(255 255 255 / .5); text-align: right; }
.reveal-desc { margin: 0; font: 400 15px/1.7 var(--mono); color: rgb(255 255 255 / .72); max-width: 54ch; }
.flag-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 13px 16px; border-radius: 10px;
  border: 1px solid rgb(255 255 255 / .12); background: rgb(255 255 255 / .04);
}
.flag-row b {
  flex-shrink: 0; font: 700 11px/1 var(--mono); letter-spacing: 1.5px; text-transform: uppercase;
}
.flag-row.green b { color: #7ee2a8; }
.flag-row.red b { color: #ff8a8a; }
.flag-row span { font: 400 14px/1.5 var(--mono); color: rgb(255 255 255 / .8); }
.reveal-actions { display: flex; gap: 12px; margin-top: 4px; }
.reveal-actions .btn svg { width: 15px; height: 15px; }

@media (max-width: 1000px) {
  .reveal-main { grid-template-columns: 1fr; gap: 44px; padding: 110px 20px 60px; }
  .reveal-stage { width: 330px; height: 458px; }
  .reveal-tilt { transform: scale(.797); transform-origin: 0 0; }
}
</style>

      desc: "Funding rates, listing gaps, bridge delays. You see basis points where others see noise, and your PnL is boring on purpose.",
      green: "Profits without caring which way the market goes", red: "Once changed exchanges for 0.4%" },
    "Narrative Trader": { slug: "10-narrative-trader",
      quote: "“ It's not a coin, it's a story.”", by: "— you, mid-thesis, pre-chart",
      desc: "You trade attention before it becomes price. Your watchlist reads like next quarter's headlines, and sometimes the market even agrees.",
      green: "Early to the narrative, receipts on the timeline", red: "Still holding when the story gets a sequel nobody asked for" },
    "Risk-First": { slug: "11-risk-first",
      quote: "“ Define the downside first.”", by: "— you, before saying hello",
      desc: "Position size before thesis, invalidation before entry. Your drawdowns are shallow, your sleep is deep, and your friends call you boring until the crash.",
      green: "Survives every cycle", red: "So hedged that winning feels theoretical" },
    "Contrarian": { slug: "12-contrarian",
      quote: "“ Everyone's bullish? Interesting.”", by: "— you, opening a short",
      desc: "When the crowd leans one way, you check the other side of the boat. Being early feels identical to being wrong, and you've budgeted for both.",
      green: "Buys when the timeline is a funeral", red: "Fights trends that had no intention of stopping" }
  };

  /* the type the quiz earned (claim.html → sessionStorage); random only when opened directly (demo) */
  var names = Object.keys(C), saved = null;
  try { saved = JSON.parse(sessionStorage.getItem("donut.result") || "null"); } catch (e) {}
  var type = saved && C[saved.name] ? saved.name : names[Math.floor(Math.random() * names.length)];
  var typeId = saved && saved.type ? saved.type : null;
  var T = C[type];
  var summonRoot = null;
  try {
    var S = window.DonutScore, ansIdx = saved && saved.answers ? ["market","horizon","strategy","risk","execution","information"].map(function (k) { var pool = S ? (S.OPTIONS[k] || S.SLIDER[k]) : null; return pool ? pool.indexOf(saved.answers[k]) : -1; }) : null;
    var kolQ = new URLSearchParams(location.search).get("kol") || (saved && saved.kol) || "";
    summonRoot = window.DonutSummon && DonutSummon.mount(document.getElementById("analyze"), { name: kolQ === "chriszhu" ? "Chris Zhu" : "YOUR DONUT ID", handle: kolQ === "chriszhu" ? "@chriszhu" : "", answers: ansIdx });
  } catch (e) {}

  document.getElementById("r-name").textContent = type;
  document.getElementById("r-quote-line").textContent = T.quote;
  document.getElementById("r-quote-by").textContent = T.by;   /* handle is set once HANDLE is known, below */
  document.getElementById("r-desc").textContent = T.desc;
  document.getElementById("r-green").textContent = T.green;
  document.getElementById("r-red").textContent = T.red;

  /* other trader types gallery: all 12, the claimed one unlocked in colour */
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  var row = document.getElementById("others-row");
  names.forEach(function (n) {
    var unlocked = n === type;
    var card = document.createElement("div");
    card.className = "other-card" + (unlocked ? " unlocked" : "");
    card.innerHTML =
      '<img src="../identity/img/archetypes/' + C[n].slug + '.jpg" alt="" loading="lazy">' +
      '<span class="oc-badge">' + (unlocked ? "Yours" : LOCK_SVG + "Locked") + '</span>' +
      '<span class="oc-name">' + n + '</span>';
    row.appendChild(card);
  });
  /* the claimed card leads the row */
  var mine = row.querySelector(".other-card.unlocked");
  if (mine) row.insertBefore(mine, row.firstChild);

  var pop = document.getElementById("reveal-pop");
  pop.src = "./art/pfp-cut.png";
  var mid = document.getElementById("reveal-mid");
  mid.src = "../flashcard/kol-pfp.jpg";
  var cutWin = document.querySelector(".reveal-win-cut"), cut = document.getElementById("reveal-cut");

  var f = document.getElementById("result-card");
  /* demo X profiles (demo-kols.js): ?kol=<id>, else the id the claim page saved with the result, else the session's pick */
  var KOLID = new URLSearchParams(location.search).get("kol") || (saved && saved.kol) || "";
  var D = window.DonutDemo ? (DonutDemo.KOLS[KOLID] ? Object.assign({ id: KOLID }, DonutDemo.KOLS[KOLID]) : DonutDemo.current()) : null;
  var DEMO = D || { name: "Your Donut ID", handle: "@RU7CRYPTOLONG", avatar: "../flashcard/kol-pfp.jpg" };
  var HANDLE = DEMO.handle, AVATAR = DEMO.avatar;
  function cardSrc(img) {
    return "../flashcard/kol-v0.html?code=DONUT2026&skin=amethyst" + "&user=" + encodeURIComponent(HANDLE.toUpperCase()) + "&type=" + encodeURIComponent(type) + (img ? "&img=" + encodeURIComponent(img) : "");
  }
  f.src = cardSrc("");
  document.getElementById("r-quote-by").textContent = T.by.replace("\u2014 you,", "\u2014 " + HANDLE.toLowerCase() + ",");
  /* ── card art from the backend (BACKEND.md §3): POST now, poll, then reveal with the art in place ── */
  var API = new URLSearchParams(location.search).get("api") || window.DONUT_CARD_API || (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? "http://127.0.0.1:3022" : "");
  var art = { status: API ? "pending" : "none", t0: Date.now(), url: "" };
  /* the avatar goes as bytes (avatar_data) — the mock server must not depend on reaching this page's origin */
  function avatarData() { return fetch(AVATAR).then(function (r) { return r.blob(); }).then(function (b) { return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.readAsDataURL(b); }); }); }
  if (API && typeId) {
    avatarData().then(function (data) { return fetch(API + "/v1/identity/card-art", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ avatar_data: data, handle: HANDLE, type: typeId }) }); })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (j.status === "done") return artDone(j.image_url, j.cutout_url, j.plate_url);
        if (!j.job_id) { art.status = "failed"; return; }
        var poll = setInterval(function () {
          fetch(API + "/v1/identity/card-art/" + j.job_id).then(function (r) { return r.json(); }).then(function (st) {
            if (st.status === "done") { clearInterval(poll); artDone(st.image_url, st.cutout_url, st.plate_url); }
            else if (st.status === "failed") { clearInterval(poll); art.status = "failed"; }
            else art.stage = st.stage;
          }).catch(function () {});
        }, 3000);
      }).catch(function () { art.status = "failed"; });
  } else if (D && D.avatar) {
    /* no backend on this host (a static deploy): the profile's own avatar fills the card window instead of the sample photo */
    artDone(new URL(D.avatar, location.href).href);
  } else art.status = "none";
  /* the demo avatar isn't on this host (they stay out of git): back to the sample persona so card and copy agree */
  function demoFallback() {
    D = null; HANDLE = "@RU7CRYPTOLONG"; f.src = cardSrc("");
    document.getElementById("r-quote-by").textContent = T.by.replace("\u2014 you,", "\u2014 " + HANDLE.toLowerCase() + ",");
    try { sessionStorage.removeItem("donut.kol"); } catch (e) {}
  }
  /* Yi's 2.5D portrait, rebuilt for the generated art: the window plane shows the backend's clean plate (the art with
     the subject blurred away — pans a little), the subject cut-out rides on a plane in front of it (pans more, sits 8px
     nearer), and the card's own photo (the full art) stays the ground under both, so the flip never shows a hole.
     Without a cut-out the art itself fills the window plane and keeps a little depth. The reveal waits for the images
     (the art is mandatory; the cut-out and plate get 8 s, then the card goes without them). */
  function artDone(url, cutUrl, plateUrl) {
    var toAbs = function (u) { return /^https?:/.test(u) ? u : API + u; };
    var abs = toAbs(url), extra = { cut: cutUrl ? toAbs(cutUrl) : "", plate: plateUrl ? toAbs(plateUrl) : "" };
    var pending = { art: true, cut: !!extra.cut, plate: !!extra.plate }, ok = { cut: false, plate: false }, finished = false;
    function settle(k, good) {
      if (!pending[k]) return; pending[k] = false; ok[k] = good;
      if (k === "art" && !good) { finished = true; if (!API && D) { demoFallback(); art.status = "none"; } else art.status = "failed"; return; }
      if (finished || pending.art || pending.cut || pending.plate) return; finished = true;
      art.url = abs; f.src = cardSrc(abs);
      mid.src = ok.cut && ok.plate ? extra.plate : abs;
      if (ok.cut) { cut.src = extra.cut; cutWin.hidden = false; }
      art.status = "done"; document.body.classList.add("has-art");
    }
    var im = new Image(); im.onload = function () { settle("art", true); }; im.onerror = function () { settle("art", false); }; im.src = abs;
    ["cut", "plate"].forEach(function (k) {
      if (!extra[k]) return;
      var i = new Image(); i.onload = function () { settle(k, true); }; i.onerror = function () { settle(k, false); }; i.src = extra[k];
      setTimeout(function () { settle(k, false); }, 8000);
    });
  }

  var stage = document.getElementById("reveal-stage");
  var tiltEl = document.getElementById("reveal-tilt");
  var flipEl = null;
  var autoFlipT = null;

  /* the card tilts and the portrait pans with the mouse, wherever it is */
  function panAt(cx, cy) {
    var r = stage.getBoundingClientRect();
    var px = Math.max(-0.9, Math.min(0.9, (cx - r.left) / r.width - 0.5));
    var py = Math.max(-0.9, Math.min(0.9, (cy - r.top) / r.height - 0.5));
    var base = getComputedStyle(tiltEl).getPropertyValue("--tilt-base").trim();   /* ≤1000px: the scale that fits the card in its box */
    tiltEl.style.transform = (base ? base + " " : "") + "perspective(900px) rotateY(" + (px * 10).toFixed(2) + "deg) rotateX(" + (-py * 8).toFixed(2) + "deg)";
    pop.style.setProperty("--px", (px * 9).toFixed(1) + "px");
    pop.style.setProperty("--py", (py * 7).toFixed(1) + "px");
    mid.style.setProperty("--mx", (px * 4.5).toFixed(1) + "px");
    mid.style.setProperty("--my", (py * 3.5).toFixed(1) + "px");
    /* the cut-out plane (generated art) inherits the same pan from the tilt box */
    tiltEl.style.setProperty("--px", (px * 9).toFixed(1) + "px");
    tiltEl.style.setProperty("--py", (py * 7).toFixed(1) + "px");
  }
  addEventListener("pointermove", function (e) { panAt(e.clientX, e.clientY); });
  /* no pointer on phones: a slow drift shows the depth by itself, and yields to a finger for a few seconds */
  if (matchMedia("(hover: none)").matches && matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    var driftT0 = Date.now(), touchedAt = 0;
    addEventListener("pointerdown", function () { touchedAt = Date.now(); });
    (function drift() {
      requestAnimationFrame(drift);
      if (!document.body.classList.contains("revealed") || Date.now() - touchedAt < 4000) return;
      var t = (Date.now() - driftT0) / 1000, r = stage.getBoundingClientRect();
      panAt(r.left + r.width * (0.5 + 0.34 * Math.sin(t * 0.5)), r.top + r.height * (0.5 + 0.24 * Math.sin(t * 0.33 + 1.1)));
    })();
  }
  /* tap-to-flip lives on the parent stage: pointerup AND click both land here,
     the debounce collapses them into one toggle */
  var lastFlip = 0;
  function tapFlip() {
    var now = Date.now();
    if (now - lastFlip < 350) return;
    lastFlip = now;
    clearTimeout(autoFlipT);
    stage.classList.add("tapped");
    if (flipEl) flipEl.classList.toggle("is-flipped");
  }
  stage.addEventListener("pointerup", tapFlip);
  stage.addEventListener("click", tapFlip);

  /* analyzing phase: status lines cycle while the bar fills, then the reveal begins */
  var AZ = ["Reading your answers", "Weighing risk against rhythm", "Consulting the charts", "Minting your identity"];
  var azEl = document.getElementById("az-status"), azI = 0;
  /* parallelogram cells: each snaps on at its moment, pink fading to gold */
  var azBar = document.getElementById("az-bar");
  for (var ci = 0; ci < 14; ci++) {
    var cell = document.createElement("i");
    var t = ci / 13;
    cell.style.setProperty("--c", "rgb(" + Math.round(255) + " " + Math.round(122 + t * 87) + " " + Math.round(194 - t * 76) + ")");
    cell.style.setProperty("--dl", (0.15 + t * 3.1).toFixed(2) + "s");
    azBar.appendChild(cell);
  }
  var azTick = setInterval(function () {
    azI = (azI + 1) % AZ.length;
    azEl.textContent = AZ[azI];
  }, 950);
  /* the reveal waits for the card art (min 3.8 s so the loader reads; max 6 min, then default art). A percentage
     appears after 8 s so a long wait is legible. */
  var ART_EXPECT = 30000, MIN_SHOW = 3800, MAX_WAIT = 360000, azPct = document.getElementById("az-pct");
  var revealing = false;
  function reveal() {
    if (revealing) return; revealing = true;
    clearInterval(azTick); clearInterval(waitTick);
    if (window.DonutSummon) DonutSummon.flare(summonRoot);
    setTimeout(revealNow, 1100);
  }
  function revealNow() {
    var ov = document.getElementById("analyze");
    ov.classList.add("done");
    setTimeout(function () { ov.remove(); }, 500);
    document.body.classList.add("revealed");
    /* no auto-flip (Cory): the card turns only when the user taps it */
  }
  var waitTick = setInterval(function () {
    var t = Date.now() - art.t0;
    if (art.status === "done" || art.status === "none" || art.status === "failed" || t > MAX_WAIT) { if (t >= MIN_SHOW) reveal(); return; }
    if (t > 8000 && azPct) { var f = t / ART_EXPECT, pct = Math.min(96, 100 * (1 - Math.exp(-f * 2.2))); if (art.stage === "gemini") pct = Math.max(pct, 78); azPct.hidden = false; azPct.querySelector("b").textContent = String(Math.round(pct)); }
  }, 250);
  
  function injectCard() {
    try {
      var doc = f.contentDocument; if (!doc || !doc.head) return;
      if (doc.getElementById("v2x")) return;
      /* the v0 snapshot ships fan-mode styles (hidden title): bring the title back; the
         photo window stays the dark ground so the cutout character owns the layer */
      var st = doc.createElement("style"); st.id = "v2x";
      /* Yi's 2.5D portrait blurs the in-card photo as its ground plane (the sharp cut-out lives on .reveal-pop);
         with generated art there is no cut-out, so the photo must stay sharp */
      var hasArt = document.body.classList.contains("has-art");
      st.textContent = "[data-ticket-title]{display:block!important}" +
        (hasArt ? ".kol-photo img{display:block!important;filter:none!important}" : ".kol-photo img{display:block!important;filter:blur(3px) brightness(.9)!important}");
      doc.head.appendChild(st);
      var dlg = doc.getElementById("flashcard");
      if (dlg) dlg.dataset.skin = "amethyst";
      var flip = doc.querySelector("[data-kol-flip]");
      if (flip) {
        flipEl = flip;
        new MutationObserver(function () {
          stage.classList.toggle("flipped", flip.classList.contains("is-flipped"));
        }).observe(flip, { attributes: true, attributeFilter: ["class"] });
      }

    } catch (e) {}
  }
  f.addEventListener("load", injectCard);
  if (f.contentDocument && f.contentDocument.readyState === "complete") injectCard();

  /* share + save (demo) */
  document.getElementById("share-btn").href = "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent("D0 says I'm a " + type + ". Claim your Donut ID → https://getdonut.ai/");
  var save = document.getElementById("save-btn");
  save.addEventListener("click", function (e) {
    e.preventDefault();
    var label = save.lastChild;
    save.style.pointerEvents = "none";
    label.textContent = " Saved";
    setTimeout(function () { label.textContent = " Save card"; save.style.pointerEvents = ""; }, 1600);
  });

  /* the reveal animation leaves filter:blur(0) filling forwards, which flattens 3D
     descendants; clear it once the entrance finishes so the portrait keeps its depth */
  var wrap = document.querySelector(".reveal-card-wrap");
  wrap.addEventListener("animationend", function (e) {
    if (e.target !== wrap) return;
    wrap.style.animation = "none";
    wrap.style.opacity = "1";
    wrap.style.filter = "none";
    wrap.style.transform = "none";
  });

  var d0 = document.getElementById("try-d0");
  if (d0) d0.addEventListener("click", function () {
    d0.classList.remove("launch"); void d0.offsetWidth; d0.classList.add("launch");
  });
})();

  /* phones: Share / Save live in a bottom bar pinned to the viewport (Cory: GTM-critical, must be on the first screen);
     moved out of .reveal-info because its reveal animation (translate) would otherwise capture position:fixed */
  (function () {
    var mq = matchMedia("(max-width: 760px)"), acts = document.querySelector(".reveal-actions"); if (!acts) return;
    var marker = document.createComment("reveal-actions"); acts.parentNode.insertBefore(marker, acts);
    function place() {
      if (mq.matches) { if (acts.parentNode !== document.body) { document.body.appendChild(acts); acts.classList.add("is-bar"); } }
      else if (acts.parentNode === document.body) { marker.parentNode.insertBefore(acts, marker.nextSibling); acts.classList.remove("is-bar"); }
    }
    place(); mq.addEventListener("change", place);
  })();
</script>
