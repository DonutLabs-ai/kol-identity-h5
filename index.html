<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Identity · Your trading style, your card</title>
<meta name="description" content="Answer a few questions and D0 turns your trading style into an identity card." />
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.ico" />
<!-- Original artifact bundle (Sean's demo, unchanged) + Donut website skin on top. -->
<link rel="stylesheet" href="./app.css" />
<link rel="stylesheet" href="./theme.css?v=20260918z" />
<script>
  // Theme before first paint: ?theme=dark|light → saved choice → light.
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q === "dark" || q === "light" ? q : localStorage.getItem("donut-identity-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      if (q) localStorage.setItem("donut-identity-theme", q);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./app.js"></script>
<script src="./theme.js?v=20260918n" defer></script>
<script src="./glass.js?v=20260918o" defer></script>
</body>
</html>
