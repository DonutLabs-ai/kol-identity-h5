<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="paper"><stop stop-color="#fffefb"/><stop offset="1" stop-color="#f3f0fa"/></radialGradient>
<radialGradient id="center"><stop offset=".2" stop-color="#fdfcfb"/><stop offset="1" stop-color="#fdfcfb" stop-opacity="0"/></radialGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
