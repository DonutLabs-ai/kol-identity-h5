<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card-art harness</title>
<style>
  :root { --bg: #0f0a22; --panel: #171130; --line: rgb(255 255 255 / .1); --ink: #f1ecff; --muted: rgb(241 236 255 / .6); --violet: #7a3dff; --gold: #e9c77b; --good: #5ee29a; --bad: #ff6b7d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Geist, "Inter", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgb(15 10 34 / .92); backdrop-filter: blur(12px); z-index: 5; }
  h1 { margin: 0; font: 400 20px/1 "Instrument Serif", Georgia, serif; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button.primary { background: var(--violet); border-color: transparent; }
  .meta { color: var(--muted); font-size: 12px; }
  main { padding: 16px 20px 60px; }
  .subject { margin: 0 0 28px; }
  .subject h2 { margin: 0 0 8px; font: 400 18px/1.2 "Instrument Serif", Georgia, serif; display: flex; align-items: center; gap: 10px; }
  .subject h2 img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
  .subject h2 .type { font: 500 11px/1 Geist, system-ui; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .rounds { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .round { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .round.best { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .round img.card { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; cursor: zoom-in; }
  .round .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top b { font-size: 22px; font-weight: 500; }
  .top .n { color: var(--muted); font-size: 12px; }
  .bars { display: grid; grid-template-columns: 78px 1fr 22px; gap: 3px 8px; font-size: 11px; color: var(--muted); align-items: center; }
  .bars i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--violet), var(--gold)); }
  .bars i.track { background: rgb(255 255 255 / .08); position: relative; }
  .bars i.track > i { position: absolute; left: 0; top: 0; }
  .critique { font-size: 12.5px; color: rgb(241 236 255 / .82); }
  details { font-size: 12px; color: var(--muted); }
  details pre { white-space: pre-wrap; font: 11px/1.4 ui-monospace, Menlo, monospace; color: rgb(241 236 255 / .75); background: rgb(0 0 0 / .25); padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; }
  .picks { display: flex; gap: 6px; }
  .picks button { padding: 4px 10px; border-radius: 999px; }
  .picks button.on.good { background: var(--good); color: #062; border-color: transparent; }
  .picks button.on.bad { background: var(--bad); color: #400; border-color: transparent; }
  .err { color: var(--bad); font-size: 12px; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }
  .rec { background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 16px; margin: 0 0 24px; }
  .rec h3 { margin: 0 0 6px; font: 400 16px/1 "Instrument Serif", Georgia, serif; color: var(--gold); }
  dialog { border: 0; background: transparent; padding: 0; max-width: 92vw; } dialog img { max-width: 92vw; max-height: 92vh; border-radius: 12px; } dialog::backdrop { background: rgb(0 0 0 / .85); }
</style>
</head>
<body>
<header>
  <h1>Card-art harness</h1>
  <select id="run"></select>
  <span class="meta" id="meta"></span>
  <button id="refresh">Refresh</button>
  <button id="export" class="primary">Export picks + notes</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const base = new URL("../out/harness/", location.href);
const KEY = "donut-harness-picks";
const picks = JSON.parse(localStorage.getItem(KEY) || "{}");
const savePicks = () => localStorage.setItem(KEY, JSON.stringify(picks));
let runs = [], current = null;
async function loadRuns() {
  runs = await fetch(new URL("runs.json", base) + "?t=" + Date.now()).then((r) => r.json()).catch(() => []);
  const sel = $("#run"); sel.innerHTML = runs.map((r) => `<option value="${r.id}">${r.id} · ${r.subjects} subj × ${r.rounds} · $${(r.spent ?? 0).toFixed(2)}</option>`).join("");
  if (!runs.length) { $("#main").innerHTML = '<div class="empty">No runs yet. Run <code>node tools/cardgen/harness/run.mjs</code>.</div>'; return; }
  if (!current || !runs.find((r) => r.id === current)) current = runs[0].id;
  sel.value = current; await loadRun();
}
async function loadRun() {
  const run = await fetch(new URL(current + "/run.json", base) + "?t=" + Date.now()).then((r) => r.json());
  $("#meta").textContent = `${run.model} · judge ${run.judge} · prompt ${run.prompt_version} · refs ${run.refs.join(", ")}${run.brand ? " + brand" : ""} · spent $${(run.spent ?? 0).toFixed(2)} / $${run.cap}${run.finished ? "" : " · running…"}`;
  const main = $("#main"); main.innerHTML = "";
  if (run.recommended_style) main.insertAdjacentHTML("beforeend", `<section class="rec"><h3>Recommended style block (merged from best rounds)</h3><details open><summary>show</summary><pre>${esc(run.recommended_style)}</pre></details></section>`);
  for (const [who, s] of Object.entries(run.subjects)) {
    const best = Math.max(...s.rounds.map((r) => r.overall ?? -1));
    const sec = document.createElement("section"); sec.className = "subject";
    sec.innerHTML = `<h2><img src="../avatars/${s.avatar}" alt="">${who} <span class="type">${s.type}</span></h2><div class="rounds"></div>`;
    for (const r of s.rounds) {
      const id = `${run.id}/${who}/${r.n}`, pick = picks[id] || {};
      const el = document.createElement("div"); el.className = "round" + (r.overall != null && r.overall === best ? " best" : "");
      el.innerHTML = (r.image ? `<img class="card" src="${new URL(run.id + "/" + r.image, base)}" alt="">` : `<div class="card" style="aspect-ratio:1;display:grid;place-items:center" class="err">${esc(r.error || "…")}</div>`) +
        `<div class="body"><div class="top"><span class="n">round ${r.n}${r.gen_secs ? ` · ${r.gen_secs}s · $${((r.gen_cost || 0) + (r.judge_cost || 0)).toFixed(2)}` : ""}</span><b>${r.overall ?? "–"}</b></div>` +
        (r.scores ? `<div class="bars">${Object.entries(r.scores).map(([k, v]) => `<span>${k.replace("_", " ")}</span><i class="track"><i style="width:${v * 10}%"></i></i><span>${v}</span>`).join("")}</div>` : "") +
        (r.critique ? `<div class="critique">${esc(r.critique)}</div>` : "") + (r.error ? `<div class="err">${esc(r.error)}</div>` : "") +
        (r.fixes ? `<details><summary>fixes the judge asked for</summary><pre>${esc(r.fixes.join("\n"))}</pre></details>` : "") +
        `<details><summary>style block used this round</summary><pre>${esc(r.style)}</pre></details>` +
        `<div class="picks"><button class="good${pick.v === "good" ? " on" : ""}" data-v="good">✓ keep</button><button class="bad${pick.v === "bad" ? " on" : ""}" data-v="bad">✗ no</button></div>` +
        `<input placeholder="your note (feeds the judge next run)" value="${esc(pick.note || "")}" style="font:inherit;font-size:12px;background:rgb(0 0 0/.25);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)"></div>`;
      el.querySelectorAll(".picks button").forEach((b) => b.addEventListener("click", () => { picks[id] = { ...(picks[id] || {}), v: picks[id]?.v === b.dataset.v ? null : b.dataset.v }; savePicks(); el.querySelectorAll(".picks button").forEach((x) => x.classList.toggle("on", picks[id].v === x.dataset.v)); }));
      el.querySelector("input").addEventListener("change", (e) => { picks[id] = { ...(picks[id] || {}), note: e.target.value }; savePicks(); });
      const img = el.querySelector("img.card"); if (img) img.addEventListener("click", () => { $("#zoom img").src = img.src; $("#zoom").showModal(); });
      sec.querySelector(".rounds").appendChild(el);
    }
    main.appendChild(sec);
  }
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
$("#run").addEventListener("change", (e) => { current = e.target.value; loadRun(); });
$("#refresh").addEventListener("click", loadRuns);
$("#export").addEventListener("click", () => { const blob = new Blob([JSON.stringify(picks, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "picks.json"; a.click(); });
$("#zoom").addEventListener("click", () => $("#zoom").close());
loadRuns(); setInterval(() => { if (document.visibilityState === "visible") loadRuns(); }, 30000);
</script>
</body>
</html>
